<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Ontology · Claims Console</title>
<style>
  :root {
    --bg: #ffffff;
    --canvas: #f7f8fa;
    --line: #e5e7eb;
    --line-strong: #d1d5db;
    --text: #111827;
    --muted: #6b7280;
    --faint: #9ca3af;
    --green: #16a34a;
    --green-soft: #ecfdf3;
    --green-line: #bbf7d0;
    --blue: #2563eb;
    --amber: #b45309;
    --amber-soft: #fffbeb;
    --red: #b91c1c;
    --red-soft: #fef2f2;
    --radius: 10px;
    --rail: 76px;
    --panel: 264px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .app { display: grid; grid-template-columns: var(--rail) 1fr; height: 100vh; overflow: hidden; }

  /* ---- icon rail ---- */
  .rail { border-right: 1px solid var(--line); background: var(--bg); padding: 10px 6px; overflow-y: auto; }
  .rail .brand {
    width: 40px; height: 40px; margin: 2px auto 14px; border-radius: 10px; display: grid;
    place-items: center; background: #0f172a; color: #4ade80; font-weight: 700; font-size: 13px;
  }
  .rail button {
    width: 100%; border: 0; background: transparent; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 2px; border-radius: 8px; font-size: 10.5px; line-height: 1.2;
  }
  .rail button svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .rail button:hover { background: #f3f4f6; color: #374151; }
  .rail button.active { background: var(--green-soft); color: #15803d; font-weight: 600; }

  .workspace { display: grid; grid-template-columns: 1fr; overflow: hidden; }
  .workspace.with-panel { grid-template-columns: var(--panel) 1fr; }

  /* ---- secondary panel ---- */
  .panel { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px 30px; background: var(--bg); }
  .panel h4 {
    margin: 16px 8px 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--faint); font-weight: 600;
  }
  .panel h4:first-child { margin-top: 2px; }
  .panel .item {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 6px 10px; border-radius: 7px; color: #374151; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .panel .item:hover { background: #f3f4f6; }
  .panel .item.active { background: var(--green-soft); color: #15803d; font-weight: 600; }
  .panel .item .small { color: var(--faint); font-size: 11px; margin-left: 6px; }

  /* ---- main ---- */
  .main { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .topbar {
    height: 54px; flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; min-width: 0; flex: 1 1 auto; overflow: hidden; white-space: nowrap; }
  .crumbs .sep { color: var(--line-strong); }
  .crumbs .here { color: var(--text); font-weight: 600; }
  .search {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: #fff;
    flex: 0 1 280px; min-width: 0;
  }
  .search svg { width: 15px; height: 15px; stroke: var(--faint); fill: none; stroke-width: 2; }
  .search input { border: 0; outline: 0; width: 100%; font-size: 13px; }
  .scroll { overflow-y: auto; overflow-x: hidden; padding: 22px 26px 60px; }
  .page-title { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font-size: 21px; font-weight: 650; letter-spacing: -.2px; }
  .page-title svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 1.8; }
  .subtitle { color: var(--muted); font-size: 13px; margin: -12px 0 18px; }

  .card { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; padding: 18px 20px; margin-bottom: 16px; }
  .card > h3 { margin: 0 0 12px; font-size: 13px; font-weight: 650; }
  .card > h3 .hint { color: var(--faint); font-weight: 400; margin-left: 8px; font-size: 12px; }
  .infogrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .infobox { background: #f9fafb; border-radius: 8px; padding: 12px 14px; min-height: 68px; }
  .infobox .label { font-size: 10.5px; letter-spacing: .7px; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
  .infobox .value { font-size: 14px; color: #1f2937; overflow-wrap: anywhere; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); background: #fafafa; }
  td { padding: 8px 10px; border-bottom: 1px solid #f1f2f4; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #fafcff; }
  .empty { color: var(--muted); padding: 18px 4px; font-size: 13px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
  .badge.ok { background: var(--green-soft); color: #15803d; border-color: var(--green-line); }
  .badge.warn { background: var(--amber-soft); color: var(--amber); border-color: #fde68a; }
  .badge.bad { background: var(--red-soft); color: var(--red); border-color: #fecaca; }
  .badge.info { background: #eff6ff; color: var(--blue); border-color: #bfdbfe; }
  .badge.neutral { background: #f3f4f6; color: var(--muted); border-color: var(--line); }

  .btn { border: 1px solid var(--line-strong); background: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; color: #374151; }
  .btn:hover { background: #f9fafb; }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.primary:hover { background: #15803d; }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .btn.small { padding: 3px 9px; font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .mono-sm { font-family: ui-monospace, monospace; font-size: 11.5px; color: #4b5563; }

  details.raw { margin-top: 10px; }
  details.raw summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre { background: #0f172a; color: #d1fae5; border-radius: 8px; padding: 12px; overflow: auto; max-height: 340px; font-size: 12px; margin: 10px 0 0; }

  /* ---- chat ---- */
  .chat { display: flex; flex-direction: column; height: 100%; }
  .chat-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 26px 30px 10px; }
  .chat-inner { max-width: 860px; margin: 0 auto; }
  .welcome { margin: 8vh auto 22px; max-width: 640px; text-align: center; }
  .welcome h2 { font-size: 24px; margin: 0 0 8px; letter-spacing: -.3px; }
  .welcome p { color: var(--muted); margin: 0 0 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; color: #374151; }
  .chip:hover { border-color: var(--green-line); background: var(--green-soft); color: #15803d; }
  .msg { display: flex; gap: 12px; margin-bottom: 20px; }
  .avatar { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .avatar.user { background: #e0e7ff; color: #3730a3; }
  .avatar.bot { background: var(--green-soft); color: #15803d; }
  .bubble { flex: 1; min-width: 0; }
  .bubble .who { font-size: 11px; color: var(--faint); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .6px; }
  .bubble .text { white-space: pre-wrap; }
  .answer-card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: #fff; overflow: hidden; }
  .answer-card .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; min-width: 0; }
  .answer-card .meta .mono-sm { overflow-wrap: anywhere; }
  .composer { flex: none; border-top: 1px solid var(--line); padding: 14px 30px 18px; background: var(--bg); }
  .composer-inner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; border: 1px solid var(--line-strong); border-radius: 12px; padding: 8px 10px; background: #fff; }
  .composer textarea { flex: 1; border: 0; outline: 0; resize: none; max-height: 120px; font-size: 14px; line-height: 1.5; padding: 4px 2px; }
  .composer .hint { color: var(--faint); font-size: 11px; margin: 8px auto 0; max-width: 860px; }

  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi .card { margin: 0; }
  .kpi .label { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
  .kpi .value { font-size: 26px; font-weight: 700; letter-spacing: -.5px; margin-top: 4px; }
  .kpi .value.green { color: var(--green); }

  .list { display: flex; flex-direction: column; }
  .list button { border: 0; background: transparent; text-align: left; padding: 9px 10px; border-radius: 7px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .list button:hover { background: #f3f4f6; }
  .list button.active { background: var(--green-soft); color: #15803d; font-weight: 600; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tabs button { border: 0; background: transparent; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px; }
  .tabs button.active { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1000px) {
    .split { grid-template-columns: 1fr; }
    .workspace.with-panel { grid-template-columns: 1fr; grid-template-rows: minmax(0, 34vh) minmax(0, 1fr); }
    .workspace.with-panel .panel { border-right: 0; border-bottom: 1px solid var(--line); }
  }
  @media (max-width: 760px) {
    .search { display: none; }
    .scroll { padding: 18px 16px 50px; }
    .chat-scroll { padding: 18px 16px 8px; }
    .composer { padding: 12px 16px 14px; }
    .page-title { font-size: 18px; }
  }
  .toast-wrap { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
  .toast { background: #111827; color: #fff; border-radius: 8px; padding: 9px 13px; font-size: 13px; max-width: min(520px, 90vw); box-shadow: 0 10px 28px rgba(0,0,0,.18); }
  .toast.err { background: #991b1b; }
  .spinner { width: 14px; height: 14px; border: 2px solid #d1d5db; border-top-color: var(--green); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <div class="workspace" id="workspace">
    <aside class="panel" id="panel" style="display:none"></aside>
    <section class="main">
      <div class="topbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="global-search" placeholder="Search terms, tables, claims…" onkeydown="if(event.key==='Enter'){go('terms')}">
        </div>
      </div>
      <div id="content" style="flex:1;overflow:hidden;display:flex;flex-direction:column"></div>
    </section>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>

<script>
const API = '/api/insurance';
const ICONS = {
  chat: '<path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-5.5A8 8 0 1 1 21 12Z"/>',
  discovery: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/>',
  terms: '<path d="M4 5h9l7 7-8 8-8-8V5Z"/><circle cx="8.5" cy="9.5" r="1.4"/>',
  analysis: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  exploration: '<path d="m3 17 5-5 4 3 6-7 3 3"/><path d="M3 21h18"/>',
  data: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  analytics: '<path d="M4 18v-6M10 18V6M16 18v-9M22 18H2"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9 2 2 0 1 1 0 4Z"/>',
};
const NAV = [
  ['chat', 'Chat'], ['discovery', 'Discovery'], ['terms', 'Terms'],
  ['analysis', 'Analysis'], ['exploration', 'Exploration'],
  ['data', 'Data'], ['analytics', 'Analytics'], ['settings', 'Settings'],
];

const state = {
  page: 'chat', health: null, claims: [], claimId: null, claim: null,
  catalog: null, table: null, tables: {}, ontology: null, definitions: null,
  rules: null, analytics: null, messages: [], busy: false,
  selectedTerm: null,
};

/* ------------------------------------------------------------------ utils */
async function api(path, options = {}) {
  const response = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' }, ...options,
  });
  let body = null;
  try { body = await response.json(); } catch (_) { body = null; }
  if (!response.ok) {
    const detail = body && body.detail ? body.detail : body;
    const text = typeof detail === 'string' ? detail : JSON.stringify(detail);
    throw new Error(text);
  }
  return body;
}

function esc(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
}

function money(value) {
  const number = Number(String(value ?? '').replaceAll(',', ''));
  if (!Number.isFinite(number)) return value == null ? '—' : String(value);
  return number.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function badge(status) {
  const value = String(status ?? '—');
  const ok = ['PASS', 'SATISFIED', 'VERIFIED', 'SETTLED', 'AUTO_APPROVED', 'PAID', 'IN_FORCE', 'CERTIFIED'];
  const warn = ['MANUAL_REVIEW', 'UNDER_REVIEW', 'REFER', 'PENDING'];
  const bad = ['FAIL', 'VIOLATED', 'REJECTED', 'DECLINED', 'FAILED'];
  const info = ['INFO', 'PRIMARY'];
  let cls = 'neutral';
  if (ok.includes(value)) cls = 'ok';
  else if (warn.includes(value)) cls = 'warn';
  else if (bad.includes(value)) cls = 'bad';
  else if (info.includes(value)) cls = 'info';
  return `<span class="badge ${cls}">${esc(value)}</span>`;
}

function toast(message, error = false) {
  const node = document.createElement('div');
  node.className = `toast${error ? ' err' : ''}`;
  node.textContent = message;
  document.getElementById('toasts').appendChild(node);
  setTimeout(() => node.remove(), 6000);
}

function table(columns, rows, empty = 'No rows.') {
  if (!rows || !rows.length) return `<div class="empty">${esc(empty)}</div>`;
  return `<div style="overflow:auto"><table><thead><tr>${columns
    .map((column) => `<th>${esc(column)}</th>`).join('')}</tr></thead><tbody>${rows
    .map((row) => `<tr>${row
      .map((cell) => {
        const text = cell == null ? '' : String(cell);
        const trusted = text.startsWith('<span class="badge') || text.startsWith('<button');
        return `<td>${trusted ? text : esc(text)}</td>`;
      })
      .join('')}</tr>`).join('')}</tbody></table></div>`;
}

function raw(label, value) {
  return `<details class="raw"><summary>${esc(label)}</summary><pre>${esc(JSON.stringify(value, null, 2))}</pre></details>`;
}

function icon(name) { return `<svg viewBox="0 0 24 24">${ICONS[name] || ''}</svg>`; }

/* ------------------------------------------------------------- navigation */
function go(page, param) {
  const hash = param ? `#/${page}/${encodeURIComponent(param)}` : `#/${page}`;
  if (location.hash === hash) { route(); } else { location.hash = hash; }
}

function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  state.page = parts[0] || 'chat';
  const param = parts[1] ? decodeURIComponent(parts[1]) : null;
  state.param = param;
  render();
}

function renderRail() {
  document.getElementById('rail').innerHTML = `<div class="brand">DO</div>` + NAV.map(([key, label]) =>
    `<button class="${state.page === key ? 'active' : ''}" onclick="go('${key}')" title="${label}">
      ${icon(key)}<span>${label}</span></button>`).join('');
}

function setCrumbs(parts, here) {
  document.getElementById('crumbs').innerHTML = parts
    .map((part) => `<span>${esc(part)}</span><span class="sep">/</span>`).join('') +
    `<span class="here">${esc(here)}</span>`;
}

async function render() {
  renderRail();
  const workspace = document.getElementById('workspace');
  const panel = document.getElementById('panel');
  const content = document.getElementById('content');
  workspace.classList.remove('with-panel');
  panel.style.display = 'none';

  if (state.page === 'chat') { setCrumbs(['Chat'], 'Claims assistant'); content.innerHTML = viewChat(); scrollChat(); return; }
  if (state.page === 'data') return renderDataPage(workspace, panel, content);
  if (state.page === 'terms') return renderTermsPage(workspace, panel, content);
  if (state.page === 'analysis') return renderAnalysisPage(workspace, panel, content);
  if (state.page === 'discovery') return renderDiscoveryPage(workspace, panel, content);
  if (state.page === 'exploration') return renderExplorationPage(workspace, panel, content);
  if (state.page === 'analytics') return renderAnalyticsPage(workspace, panel, content);
  if (state.page === 'settings') return renderSettingsPage(workspace, panel, content);
}

/* ------------------------------------------------------------------- chat */
const CHAT_SUGGESTIONS = [
  'What is the status of CLM-2001?',
  'Why was CLM-2001 approved?',
  'Show the audit chain for CLM-2001',
  'Which claims are under manual review?',
  'What is net_death_benefit for POL-1001?',
  'List the ontology constraints',
];

function viewChat() {
  const messages = state.messages.map((message) => message.role === 'user'
    ? `<div class="msg"><div class="avatar user">You</div><div class="bubble">
        <div class="who">You</div><div class="text">${esc(message.text)}</div></div></div>`
    : `<div class="msg"><div class="avatar bot">DO</div><div class="bubble">
        <div class="who">Claims assistant · deterministic</div>${renderAnswer(message.data)}</div></div>`).join('');
  const welcome = state.messages.length ? '' : `<div class="welcome">
      <h2>Ask the claims database</h2>
      <p>Questions resolve against the ${state.catalog ? state.catalog.table_count : 23} claims tables,
      the ontology and the certified semantic layer. Every answer includes the SQL it used.</p>
      <div class="chips">${CHAT_SUGGESTIONS.map((question) =>
        `<button class="chip" onclick="askQuestion('${esc(question).replaceAll("'", "\\'")}')">${esc(question)}</button>`).join('')}</div>
    </div>`;
  return `<div class="chat">
    <div class="chat-scroll" id="chat-scroll"><div class="chat-inner">${welcome}${messages}
      ${state.busy ? '<div class="msg"><div class="avatar bot">DO</div><div class="bubble"><span class="spinner"></span> <span class="muted">Querying the catalog…</span></div></div>' : ''}
    </div></div>
    <div class="composer"><div class="composer-inner">
      <textarea id="chat-input" rows="1" placeholder="Ask about a claim, rule, definition or constraint…"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
      <button class="btn primary" onclick="sendChat()">Send</button>
    </div><div class="hint">Enter to send · Shift+Enter for a new line · read-only, answers cite SQL</div></div>
  </div>`;
}

function renderAnswer(data) {
  const meta = `<div class="meta"><span class="badge info">${esc(data.intent)}</span>
    ${data.sources && data.sources.length ? `<span class="faint mono-sm">${esc(data.sources.join(' · '))}</span>` : ''}</div>`;
  const resultTable = data.table && data.table.columns && data.table.columns.length
    ? `<div style="margin-top:12px">${table(data.table.columns, data.table.rows, 'No rows matched.')}</div>` : '';
  const sql = data.sql ? `<details class="raw"><summary>SQL used</summary><pre>${esc(data.sql)}</pre></details>` : '';
  return `<div class="answer-card">${meta}<div class="text">${esc(data.answer)}</div>${resultTable}${sql}</div>`;
}

function scrollChat() {
  const node = document.getElementById('chat-scroll');
  if (node) node.scrollTop = node.scrollHeight;
}

async function askQuestion(question) {
  if (state.busy) return;
  if (state.page !== 'chat') { state.page = 'chat'; location.hash = '#/chat'; }
  state.messages.push({ role: 'user', text: question });
  state.busy = true;
  render();
  try {
    const answer = await api('/ask', { method: 'POST', body: JSON.stringify({ question }) });
    state.messages.push({ role: 'assistant', data: answer });
  } catch (error) {
    state.messages.push({ role: 'assistant', data: { intent: 'error', answer: error.message } });
  }
  state.busy = false;
  render();
}

function sendChat() {
  const input = document.getElementById('chat-input');
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  askQuestion(question);
}

async function loadClaims() {
  const body = await api('/claims');
  state.claims = body.claims || [];

}

async function decideClaim() {
  try {
    const decision = await api(`/claims/${encodeURIComponent(state.claimId)}/decision`, {
      method: 'POST', body: JSON.stringify({ actor: 'officer:j.mensah' }),
    });
    toast(`${decision.approval_status} · $${money(decision.net_payout_amount)}`);
  } catch (error) { toast(error.message, true); }
  await loadClaims();
  state.claim = await api(`/claims/${encodeURIComponent(state.claimId)}`);
  render();
}

async function payClaim() {
  const key = prompt('Idempotency key (min 8 chars)', `ui-${state.claimId}-payout-1`);
  if (!key) return;
  try {
    const payment = await api(`/claims/${encodeURIComponent(state.claimId)}/payments`, {
      method: 'POST',
      body: JSON.stringify({ idempotency_key: key, approver_id: 'officer:j.mensah' }),
    });
    toast(`${payment.status} · $${money(payment.amount)} · ${payment.provider_reference}`);
  } catch (error) { toast(error.message, true); }
  await loadClaims();
  state.claim = await api(`/claims/${encodeURIComponent(state.claimId)}`);
  render();
}

async function verifyPayment(paymentId) {
  try {
    const result = await api(`/payments/${encodeURIComponent(paymentId)}/verify`, { method: 'POST' });
    toast(`${result.verification_status} · audit ${result.audit_chain && result.audit_chain.intact ? 'intact' : 'broken'}`);
  } catch (error) { toast(error.message, true); }
  state.claim = await api(`/claims/${encodeURIComponent(state.claimId)}`);
  render();
}

async function showAudit() {
  try {
    const audit = await api(`/claims/${encodeURIComponent(state.claimId)}/audit`);
    document.getElementById('audit-slot').innerHTML = `<div class="card">
      <h3>Audit chain <span class="hint">${audit.intact ? 'intact' : 'broken at ' + audit.broken_at}</span></h3>
      <div class="row" style="margin-bottom:10px">${badge(audit.intact ? 'VERIFIED' : 'FAIL')}

        [event.event_id, event.actor, event.action, String(event.occurred_at).replace('T', ' ').slice(0, 19)]))}</div>`;
  } catch (error) { toast(error.message, true); }
}

  window.addEventListener('hashchange', route);
})();
</script>
